let actx=null,master=null;
function initAudio(){ if(actx) return;
  actx=new (window.AudioContext||window.webkitAudioContext)();
  master=actx.createGain(); master.gain.value=0.5; master.connect(actx.destination); }
function playDon(big){ if(!actx) return; const t=actx.currentTime;
  const o=actx.createOscillator(),g=actx.createGain();
  o.type='sine'; o.frequency.setValueAtTime(big?185:150,t); o.frequency.exponentialRampToValueAtTime(55,t+0.18);
  g.gain.setValueAtTime(big?0.85:0.55,t); g.gain.exponentialRampToValueAtTime(0.001,t+(big?0.34:0.24));
  o.connect(g).connect(master); o.start(t); o.stop(t+0.4);
  const n=actx.createBufferSource(),buf=actx.createBuffer(1,1100,actx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
  n.buffer=buf; const f=actx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=420;
  const ng=actx.createGain(); ng.gain.value=0.22; n.connect(f).connect(ng).connect(master); n.start(t); }
function playKa(){ if(!actx) return; const t=actx.currentTime;
  const n=actx.createBufferSource(),buf=actx.createBuffer(1,600,actx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
  n.buffer=buf; const f=actx.createBiquadFilter(); f.type='highpass'; f.frequency.value=2000;
  const g=actx.createGain(); g.gain.value=0.18; n.connect(f).connect(g).connect(master); n.start(t); n.stop(t+0.09); }
function playBass(b){ if(!actx) return; const t=actx.currentTime; const o=actx.createOscillator(),g=actx.createGain();
  o.type='triangle'; o.frequency.value=110; g.gain.setValueAtTime(b?0.2:0.13,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.3);
  o.connect(g).connect(master); o.start(t); o.stop(t+0.32); }
function playPluck(freq,b){ if(!actx) return; const t=actx.currentTime; const o=actx.createOscillator(),g=actx.createGain();
  o.type='triangle'; o.frequency.value=freq; g.gain.setValueAtTime(b?0.2:0.13,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.34);
  o.connect(g).connect(master); o.start(t); o.stop(t+0.36);
  const o2=actx.createOscillator(),g2=actx.createGain(); o2.type='sawtooth'; o2.frequency.value=freq*2;
  g2.gain.setValueAtTime(0.045,t); g2.gain.exponentialRampToValueAtTime(0.001,t+0.08);
  o2.connect(g2).connect(master); o2.start(t); o2.stop(t+0.1); }

function buildChart(mel){            // メロディ各音に 左手/右手/手拍子 を割り当て
  const chart=new Array(mel.length).fill(null); let order=0;
  for(let k=0;k<mel.length;k++){ if(mel[k]){
    chart[k]= (order%8===7)?'clap':(order%2===0?'left':'right'); order++; } }
  return chart;
}
// 会場ごとの譜面：後半ほど密で速く、交互じゃない連打や手拍子も混ぜる
function buildChart2(idx){
  const bars=8, len=bars*8, chart=new Array(len).fill(null);
  const eighthP=0.10+idx*0.06;            // 後半ほど8分（裏拍）が増える＝速く・ボタン多く
  const clapP=0.10+idx*0.012, runP=0.24;  // runP=同じ手の連打（交互じゃない）
  let hand=Math.random()<0.5?'left':'right';
  for(let b=0;b<bars;b++) for(let s=0;s<8;s++){
    if(s===1||s===5) continue;            // 無音スロットには置かない（音と一致させる）
    const k=b*8+s, onbeat=(s%2===0);
    if(onbeat){ if(Math.random()>0.92) continue; } else { if(Math.random()>eighthP) continue; }
    const r=Math.random();
    if(r<clapP) chart[k]='clap';
    else if(r<clapP+runP) chart[k]=hand;                       // 同じ手をもう一度（連打）
    else { hand=hand==='left'?'right':'left'; chart[k]=hand; } // 手を替える
  }
  for(let b=0;b<bars;b++){ const k=b*8; if(!chart[k]){ hand=hand==='left'?'right':'left'; chart[k]=hand; } } // 各小節頭は必ず
  return chart;
}

function newState(){ return {
  phase:'title', stage:0,
  beat:0.5, el:0.25, mel:[], chart:[],
  songTime:0, beatIndex:-1, eighthIndex:-1, spawnEighth:0, beatPulse:0,

  heat:0, fever:0, lhand:0, rhand:0, lastPress:{left:-9,right:-9},
  audience:[], followers:[], ripples:[], effects:[], bigTexts:[], notes:[],
  great:0, good:0, flash:0, clearTimer:0, introT:0, target:0, paused:false, life:MAXLIFE,
  approach:APPROACH,
}; }
state=newState();

function startStage(idx){
  const s=STAGES[idx]; state.stage=idx;
  state.approach = idx>=10 ? APPROACH/1.5 : APPROACH;  // 11会場目(idx=10)から約1.5倍速、1〜10会場は元の速度
  state.beat=60/(100+idx*6); state.el=state.beat/2;   // 会場ごとにテンポUP（100→154）
  state.mel=s.mel; state.chart=buildChart2(idx);
  state.songTime=0; state.beatIndex=-1; state.eighthIndex=-1; state.spawnEighth=0;
  state.notes=[]; state.ripples=[]; state.audience=[];
  state.life=MAXLIFE;                     // 会場ごとに体力を満タンに
  state.target=120+idx*30;               // この会場で巻き込む目標人数（クリア条件）※長め
  for(let i=0;i<state.target;i++){ const a=Math.random()*6.2832, rr=RP*(1.30+Math.random()*0.66);
    state.audience.push({x:CX+Math.cos(a)*rr,y:CY+Math.sin(a)*rr*VF,conv:false,ph:Math.random()*6.28}); }
  state.introT=3.2; state.phase='intro';  // 会場スタート演出（3・2・1 カウント）
}
function startGame(){ initAudio(); if(actx&&actx.state==='suspended') actx.resume();
  state=newState(); startStage(0); }

const pathPos=a=>({x:CX+Math.cos(a)*RP,y:CY+Math.sin(a)*RP*VF});

// ===== お囃子の進行 =====
function onEighth(i){
  if(state.phase!=='play' && state.phase!=='stageclear') return;
  const f=state.mel[((i%state.mel.length)+state.mel.length)%state.mel.length]; if(f) playPluck(f,state.fever>0);
  const s=((i%8)+8)%8; if(s===0||s===4) playBass(state.fever>0);
  if(state.fever>0){ playDon(i%2===0); if(i%2===0) state.beatPulse=1; return; }
  const h=TAIKO[s]; if(h==='DON'){ playDon(true); state.beatPulse=1; } else if(h==='don') playDon(false); else if(h==='ka') playKa();
}

// ===== 入力（← 左手 / → 右手 / 両方 手拍子） =====
const inGame=()=> state.phase==='play'||state.phase==='intro'||state.phase==='stageclear';
addEventListener('keydown',e=>{
  if(['Space','Enter','KeyR','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','KeyP','Escape','Backspace','KeyL'].includes(e.code)) e.preventDefault();
  if(e.code==='KeyL'){ toggleLang(); return; }   // L キーで言語切替（いつでも）
  if(state.phase==='title'){ if(['Space','Enter'].includes(e.code)) startGame(); return; }
  if(state.phase==='gameclear'||state.phase==='gameover'){ if(['Space','Enter','KeyR'].includes(e.code)) state=newState(); return; }
  // 一時停止／再生／最初へ（ゲーム中いつでも）
  if(e.code==='KeyP'||e.code==='Escape'){ state.paused=!state.paused; return; }
  if(e.code==='Backspace'){ state=newState(); return; }
  if(state.phase!=='play' || state.paused || e.repeat) return;
  if(e.code==='ArrowLeft') onHand('left');
  else if(e.code==='ArrowRight') onHand('right');
});

// ===== ボタン＆タッチ（マウス・スマホ両対応） =====
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints>0;
const BTN_LANG ={x:W-300,y:5,w:62, h:38};
const BTN_PAUSE={x:W-232,y:5,w:120,h:38};
const BTN_BACK ={x:W-104,y:5,w:96, h:38};
function toggleLang(){ lang = lang==='ja'?'en':'ja'; updateHint(); }
const OV_RESUME={x:CX-200,y:H/2+24,w:185,h:58};
const OV_BACK  ={x:CX+15, y:H/2+24,w:185,h:58};
const inRect=(x,y,r)=> x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;
function pointerDown(x,y){
  if(state.phase==='title'){
    if(inRect(x,y,BTN_LANG)){ toggleLang(); return; }   // タイトルでも言語切替
    startGame(); return;
  }
  if(state.phase==='gameclear'||state.phase==='gameover'){ if(inRect(x,y,BTN_LANG)){ toggleLang(); return; } state=newState(); return; }
  if(!inGame()) return;
  // 上部ボタンは「プレイ中でも一時停止中でも」常に効く
  if(inRect(x,y,BTN_LANG)){ toggleLang(); return; }
  if(inRect(x,y,BTN_PAUSE)){ state.paused=!state.paused; return; }
  if(inRect(x,y,BTN_BACK)){ state=newState(); return; }
  if(state.paused){
    if(inRect(x,y,OV_RESUME)) state.paused=false;
    else if(inRect(x,y,OV_BACK)) state=newState();
    return;
  }
  // プレイ中：画面の左半分タップ＝左手、右半分＝右手（両方同時タップ＝手拍子）
  if(state.phase==='play' && y>110){ if(x<CX) onHand('left'); else onHand('right'); }
}
function canvasXY(clientX,clientY){ const rc=cv.getBoundingClientRect();
  return [(clientX-rc.left)*(W/rc.width),(clientY-rc.top)*(H/rc.height)]; }
cv.addEventListener('mousedown',e=>{ const [x,y]=canvasXY(e.clientX,e.clientY); pointerDown(x,y); });
cv.addEventListener('touchstart',e=>{ e.preventDefault();
  for(const t of e.changedTouches){ const [x,y]=canvasXY(t.clientX,t.clientY); pointerDown(x,y); }
},{passive:false});
// iOS等：最初のタッチで音声を有効化
window.addEventListener('touchend',()=>{ if(actx&&actx.state==='suspended') actx.resume(); },{passive:true});

function onHand(hand){
  const now=state.songTime; state.lastPress[hand]=now;
  if(hand==='left') state.lhand=1; else state.rhand=1;
  shout();
  if(state.fever>0){ spawnRipple('fever',3); playTone(1320); return; }
  // ★この手で取れるノーツ（その手 or 手拍子）の中だけで一番近いものを探す
  let best=null,bd=99;
  for(const nt of state.notes){ if(nt.hit||nt.miss) continue;
    if(nt.type!=='clap' && nt.type!==hand) continue;
    const d=Math.abs(nt.t-now); if(d<bd){bd=d;best=nt;} }
  if(!best || bd>0.42){ addEffect(t('miss'),'#999'); state.combo=0; return; }
  if(best.type==='clap'){
    const other=hand==='left'?'right':'left';
    if(now-state.lastPress[other]<=0.24){ state.lhand=1; state.rhand=1; resolveHit(best,Math.abs(best.t-now),true); }
    return;   // 相方待ち（ペナルティなし）
  }
  resolveHit(best,bd,false);
}
function resolveHit(nt,dt,clap){
  nt.hit=true;
  if(dt<0.09){ state.great++; state.heat+=clap?2:1.4; state.combo++; state.life=Math.min(MAXLIFE,state.life+2.5); spawnRipple(clap?'fever':'excellent', clap?3:2);
    addEffect(clap?t('clapP'):t('perfect'),'#fff200'); playTone(clap?1480:1320); }
  else if(dt<0.2){ state.good++; state.heat+=clap?1.4:1; state.combo++; state.life=Math.min(MAXLIFE,state.life+1.5); spawnRipple(clap?'excellent':'good', clap?2:1);
    addEffect(clap?t('clapG'):t('good'),'#9fffba'); playTone(990); }
  else { state.heat+=0.5; state.combo=0; spawnRipple('good',1); addEffect(t('ok'),'#ffaa55'); playTone(740); }
  state.maxCombo=Math.max(state.maxCombo,state.combo);
  checkFever();
}
function checkFever(){ if(state.heat>=100 && state.fever<=0){ state.fever=6.5; state.flash=30; state.heat=100; addBig(t('voltage')); }
  if(state.heat>100) state.heat=100; }
function spawnRipple(q,cap){ const p=playerPos(); const maxR=q==='fever'?340:q==='excellent'?230:150;
  state.ripples.push({x:p.x,y:p.y,r:8,maxR,grow:560,fever:q==='fever',cap:cap||1,got:0}); }

function addEffect(txt,color){ const p=playerPos(); state.effects.push({txt,color,x:p.x,y:p.y-66,life:34,vy:-1.5}); }
function shout(){ const S=lang==='ja'?SHOUTS_JA:SHOUTS_EN; const p=playerPos(); state.effects.push({txt:S[(Math.random()*S.length)|0],color:'#ffcc00',x:p.x+(Math.random()*40-20),y:p.y-40,life:38,vy:-1.8}); }
function addBig(txt){ state.bigTexts.push({txt,life:90}); }
function convert(a){ a.conv=true; state.followers.push({sx:a.x,sy:a.y,join:0,ph:a.ph}); state.score++; }

// ===== 更新 =====
function update(dt){
  const musical = state.phase==='intro'||state.phase==='play'||state.phase==='stageclear';
  if(musical){
    state.songTime+=dt;
    while(state.songTime>=(state.beatIndex+1)*state.beat) state.beatIndex++;
    while(state.eighthIndex<Math.floor(state.songTime/state.el)){ state.eighthIndex++; onEighth(state.eighthIndex); }
    state.beatPulse=Math.max(0,state.beatPulse-dt*4);
    state.lhand=Math.max(0,state.lhand-dt*3); state.rhand=Math.max(0,state.rhand-dt*3);
    state.angle+=(state.angSpeed+(state.fever>0?0.5:0))*dt;
    state.audience.forEach(a=>a.ph+=dt*3);
    state.followers.forEach(f=>{ if(f.join<1) f.join=Math.min(1,f.join+dt*2.2); f.ph+=dt*5; });
    // 波紋を広げ、上限人数だけ巻き込む（一気に全員にはならない）
    for(const rp of state.ripples){ rp.r+=rp.grow*dt;
      if(rp.got<rp.cap) for(const a of state.audience){ if(rp.got>=rp.cap) break;
        if(!a.conv && Math.hypot(a.x-rp.x,a.y-rp.y)<=rp.r){ convert(a); rp.got++; } } }
    state.ripples=state.ripples.filter(rp=>rp.r<rp.maxR);
    state.audience=state.audience.filter(a=>!a.conv);
    if(state.flash>0) state.flash-=dt*30;
    updateEffects(dt);
  }

  // 会場スタート演出（カウントダウン）
  if(state.phase==='intro'){
    state.introT-=dt;
    if(state.introT<=0){ state.phase='play'; state.spawnEighth=Math.floor(state.songTime/state.el)+1; }
    return;
  }
  // クリア演出 → 次の会場へ
  if(state.phase==='stageclear'){
    state.clearTimer-=dt;
    if(state.clearTimer<=0){ if(state.stage+1<STAGES.length) startStage(state.stage+1); else state.phase='gameclear'; }
    return;
  }
  if(state.phase!=='play'){ updateEffects(dt); return; }

  // ===== プレイ中だけ：ノーツ出現・見逃し・クリア判定 =====
  while(state.spawnEighth*state.el - state.songTime <= state.approach){
    const j=state.spawnEighth, ty=state.chart[((j%state.chart.length)+state.chart.length)%state.chart.length];
    if(ty && !(state.fever>0)) state.notes.push({t:j*state.el,type:ty,hit:false,miss:false});
    state.spawnEighth++;
  }
  for(const nt of state.notes){ if(!nt.hit&&!nt.miss && state.songTime-nt.t>0.46){
    nt.miss=true; state.heat=Math.max(0,state.heat-1); state.combo=0;
    state.life-=9; addEffect(t('missEf'),'#ff5555');     // 見逃しで体力ダウン
    if(state.life<=0){ state.life=0; state.phase='gameover'; addBig(t('gameover')); } } }
  state.notes=state.notes.filter(nt=> state.songTime-nt.t < 0.7);

  if(state.fever>0){ state.fever-=dt;
    if(state.fever<=0){ state.fever=0; state.heat=0; state.spawnEighth=Math.floor(state.songTime/state.el)+1; } }

  // 目標人数を全員巻き込んだらクリア（達成するまで会場は変わらない）
  if(state.audience.length===0){ state.phase='stageclear'; state.clearTimer=3.0; state.flash=30;
    addBig(t('cleared')(state.stage)); }
}
function updateEffects(dt){ state.effects.forEach(e=>{ e.y+=e.vy; e.life--; }); state.effects=state.effects.filter(e=>e.life>0);
  state.bigTexts.forEach(t=>t.life--); state.bigTexts=state.bigTexts.filter(t=>t.life>0); }

// ===== 描画 =====
const lerp=(a,b,t)=>a+(b-a)*t, easeOut=t=>1-(1-t)*(1-t);
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function drawBackground(){
  const st=STAGES[state.stage]||STAGES[0], fever=state.fever>0;
  let g=ctx.createLinearGradient(0,0,0,H);
  if(fever){ g.addColorStop(0,'#3a0050'); g.addColorStop(0.6,'#aa1133'); g.addColorStop(1,'#ff7a00'); }
  else { g.addColorStop(0,st.sky[0]); g.addColorStop(0.65,st.sky[1]); g.addColorStop(1,'#5a2a3a'); }
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle=fever?'#ffe0a0':'#fff4d0'; ctx.beginPath(); ctx.arc(W-90,70,32,0,6.28); ctx.fill();
  ctx.fillStyle='#fff'; for(let i=0;i<44;i++){ const x=(i*137.5)%W,y=(i*61.3)%180;
    ctx.globalAlpha=0.35+0.6*Math.abs(Math.sin(i+state.songTime*2)); ctx.fillRect(x,y,2,2); }
  ctx.globalAlpha=1; if(fever) drawFireworks();
  drawLanterns(40,0,fever); drawLanterns(100,0.5,fever);
  let gg=ctx.createRadialGradient(CX,CY,40,CX,CY,360); gg.addColorStop(0,fever?'#5a2030':st.ground); gg.addColorStop(1,'#120a18');
  ctx.fillStyle=gg; ctx.fillRect(0,H*0.38,W,H);
}
function drawFireworks(){ const t=state.songTime; for(let f=0;f<3;f++){ const cx=150+f*290+Math.sin(t*0.7+f)*40, cy=100+Math.cos(t*0.9+f*2)*28;
  const r=26+(Math.sin(t*3+f)*0.5+0.5)*42, hue=(f*120+t*120)%360; ctx.globalAlpha=0.6;
  for(let i=0;i<16;i++){ const a=i/16*6.28; ctx.strokeStyle=`hsl(${hue},90%,65%)`; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r); ctx.stroke(); } } ctx.globalAlpha=1; }
function drawLanterns(y,off,fever){ ctx.strokeStyle='#553300'; ctx.lineWidth=2;
  ctx.beginPath(); for(let x=0;x<=W;x+=10) ctx.lineTo(x,y-10+Math.sin(x/80)*8); ctx.stroke();
  for(let i=0;i<8;i++){ const x=(i+off)*120+30; if(x>W) continue; const ly=y-10+Math.sin(x/80)*8+6;
    const col=['#ff3322','#ffcc00','#ff7733','#ffffff'][i%4];
    if(fever){ ctx.shadowColor=col; ctx.shadowBlur=10+10*Math.sin(state.songTime*10+i); }
    ctx.fillStyle=col; ctx.beginPath(); ctx.ellipse(x,ly+12,12,16,0,0,6.28); ctx.fill(); ctx.shadowBlur=0;
    ctx.fillStyle='#332200'; ctx.fillRect(x-3,ly-4,6,6); } }
function drawYagura(){
  const fever=state.fever>0, baseY=CY+8, topY=CY-168;
  ctx.strokeStyle=fever?'#ffaa44':'#7a5230'; ctx.lineWidth=8;
  ctx.beginPath(); ctx.moveTo(CX-60,baseY); ctx.lineTo(CX-34,topY); ctx.moveTo(CX+60,baseY); ctx.lineTo(CX+34,topY); ctx.stroke();
  ctx.lineWidth=4; for(let i=1;i<=3;i++){ const yy=baseY-(baseY-topY)*i/4, wd=60-(60-34)*i/4;
    ctx.beginPath(); ctx.moveTo(CX-wd,yy); ctx.lineTo(CX+wd,yy); ctx.stroke(); }
  ctx.fillStyle='#fff'; ctx.fillRect(CX-40,topY-4,80,22);
  ctx.fillStyle='#e02030'; for(let i=0;i<6;i++) ctx.fillRect(CX-40+i*14,topY-4,7,22);
  ctx.fillStyle=fever?'#ffcc44':'#553322'; ctx.beginPath(); ctx.moveTo(CX-54,topY); ctx.lineTo(CX,topY-40); ctx.lineTo(CX+54,topY); ctx.fill();
  ctx.fillStyle='#ffcc00'; ctx.beginPath(); ctx.arc(CX,topY-44,6,0,6.28); ctx.fill();
  const dy=topY+42; ctx.fillStyle='#7a1818'; ctx.beginPath(); ctx.ellipse(CX,dy,30,22,0,0,6.28); ctx.fill();
  ctx.fillStyle='#e8d8b0'; ctx.beginPath(); ctx.ellipse(CX,dy,20,18,0,0,6.28); ctx.fill();
  ctx.strokeStyle='#7a1818'; ctx.lineWidth=3; ctx.stroke();
  if(state.beatPulse>0){ ctx.strokeStyle=`rgba(255,220,120,${state.beatPulse})`; ctx.lineWidth=3;
    ctx.beginPath(); ctx.ellipse(CX,dy,20+(1-state.beatPulse)*16,18+(1-state.beatPulse)*14,0,0,6.28); ctx.stroke(); }
  const arm=Math.max(0,state.beatPulse), sx=state.beatIndex%2?-1:1;
  ctx.fillStyle='#1a1a2a'; ctx.beginPath(); ctx.arc(CX+sx*26,dy-30,10,0,6.28); ctx.fill();
  ctx.fillStyle='#ff3322'; ctx.fillRect(CX+sx*26-9,dy-22,18,22);
  ctx.strokeStyle='#e8d8b0'; ctx.lineWidth=4; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(CX+sx*18,dy-15); ctx.lineTo(CX+sx*4,dy-17-arm*13); ctx.stroke();
}
function drawPerson(x,y,o){ const {sway=0,arms=0,color='#888',idle=false,leader=false,scale=1,armL=null,armR=null}=o;
  const AL=armL!=null?armL:arms, AR=armR!=null?armR:arms;
  ctx.save(); ctx.translate(x,y); ctx.scale(scale,scale); ctx.rotate(sway*0.09);
  ctx.fillStyle=color; ctx.beginPath(); ctx.moveTo(-11,0); ctx.lineTo(-8,-32); ctx.lineTo(8,-32); ctx.lineTo(11,0); ctx.closePath(); ctx.fill();
  ctx.fillStyle=leader?'#fff200':'#ffe066'; ctx.fillRect(-11,-13,22,5);
  ctx.fillStyle='#ffe0bd'; ctx.beginPath(); ctx.arc(0,-41,8.5,0,6.28); ctx.fill();
  ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(0,-44,8.5,Math.PI,6.28); ctx.fill();
  if(leader){ ctx.fillStyle='#ff2222'; ctx.fillRect(-9,-46,18,4); }
  ctx.strokeStyle='#ffe0bd'; ctx.lineWidth=4; ctx.lineCap='round';
  if(idle){ ctx.beginPath(); ctx.moveTo(-7,-26); ctx.lineTo(-12,-6); ctx.stroke(); ctx.beginPath(); ctx.moveTo(7,-26); ctx.lineTo(12,-6); ctx.stroke(); }
  else{ const la=-0.6-AL*1.3+sway*0.3, ra=0.6+AR*1.3+sway*0.3;
    ctx.beginPath(); ctx.moveTo(-7,-28); ctx.lineTo(-7+Math.cos(Math.PI+la)*16,-28+Math.sin(Math.PI+la)*16); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(7,-28); ctx.lineTo(7+Math.cos(-ra)*16,-28+Math.sin(-ra)*16); ctx.stroke(); }
  ctx.restore(); }
const FC=['#cc3355','#3366aa','#cc7722','#558844','#9944aa','#1199aa'];
function drawCrowd(){ const fever=state.fever>0, figs=[];
  const aud=state.audience, astep=Math.max(1,Math.ceil(aud.length/220));  // 観客は最大220人だけ描画
  for(let i=0;i<aud.length;i+=astep){ const a=aud[i]; figs.push({x:a.x,y:a.y,type:'aud',sway:Math.sin(a.ph)*0.4}); }
  const pp=playerPos(); figs.push({x:pp.x,y:pp.y,type:'leader'});
  const GAP=Math.max(0.055,0.2-state.followers.length*0.0009);
  const fl=state.followers, MAXF=180, start=Math.max(0,fl.length-MAXF); // 重くならないよう描画は上限まで
  for(let i=start;i<fl.length;i++){ const f=fl[i]; const ang=state.angle-(i+1)*GAP, tp=pathPos(ang), t=easeOut(f.join);
    figs.push({x:lerp(f.sx,tp.x,t),y:lerp(f.sy,tp.y,t),type:'d',idx:i,ph:f.ph}); }
  figs.sort((a,b)=>a.y-b.y);
  for(const f of figs){
    if(f.type==='aud') drawPerson(f.x,f.y,{idle:true,color:'#9a93a8',sway:f.sway,scale:0.92});
    else if(f.type==='leader'){ const sway=Math.sin(state.songTime*5);
      drawPerson(f.x,f.y,{leader:true,color:fever?'#ffd24a':'#e8322f',sway,armL:0.2+state.lhand,armR:0.2+state.rhand,scale:1.14}); }
    else{ const sway=Math.sin(f.ph),arms=0.5+0.5*Math.abs(Math.sin(f.ph));
      drawPerson(f.x,f.y,{color:fever?'#ffd24a':FC[f.idx%FC.length],sway,arms}); } } }
function drawRipples(){ for(const r of state.ripples){ const a=1-r.r/r.maxR; ctx.save(); ctx.globalAlpha=a*0.8;
  ctx.strokeStyle=r.fever?'#fff200':'#ffd24a'; ctx.lineWidth=5; ctx.beginPath(); ctx.ellipse(r.x,r.y,r.r,r.r*VF,0,0,6.28); ctx.stroke();
  ctx.strokeStyle='#ff6688'; ctx.lineWidth=2; ctx.beginPath(); ctx.ellipse(r.x,r.y,r.r*0.7,r.r*0.7*VF,0,0,6.28); ctx.stroke(); ctx.restore(); } }

function drawNoteDisc(x,y,col,txt){ ctx.save(); ctx.shadowColor=col; ctx.shadowBlur=12;
  ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x,y,20,0,6.28); ctx.fill(); ctx.shadowBlur=0;
  ctx.fillStyle='#fff'; ctx.font='bold 20px "Yu Mincho",serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(txt,x,y+1); ctx.textBaseline='alphabetic'; ctx.restore(); }
function drawNotes(){
  const bp=((state.songTime%state.beat)/state.beat+1)%1, glow=1-bp;
  [[Lx,'left',t('laneL'),'#ff6688'],[Rx,'right',t('laneR'),'#66aaff']].forEach(([x,hand,lab,col])=>{
    ctx.fillStyle='rgba(0,0,0,0.22)'; ctx.fillRect(x-34,TOPY-8,68,HITY-TOPY+44);
    ctx.fillStyle=`rgba(255,255,255,${0.08+glow*0.28})`; ctx.beginPath(); ctx.arc(x,HITY,24,0,6.28); ctx.fill();
    ctx.strokeStyle=col; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(x,HITY,24,0,6.28); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='bold 14px serif'; ctx.textAlign='center'; ctx.fillText(lab,x,HITY+42);
  });
  if(state.fever<=0) for(const nt of state.notes){ if(nt.miss||nt.hit) continue;
    const prog=(nt.t-state.songTime)/state.approach; if(prog>1.05) continue;
    const y=HITY-prog*(HITY-TOPY);
    if(nt.type==='clap'){ ctx.strokeStyle='rgba(255,242,0,0.65)'; ctx.lineWidth=4;
      ctx.beginPath(); ctx.moveTo(Lx,y); ctx.lineTo(Rx,y); ctx.stroke();
      drawNoteDisc(Lx,y,'#ffcc00',t('clapLabel1')); drawNoteDisc(Rx,y,'#ffcc00',t('clapLabel2'));
      ctx.fillStyle='#fff200'; ctx.font='bold 16px "Yu Mincho",serif'; ctx.textAlign='center'; ctx.fillText(t('clapTag'),CX,y-16); }
    else drawNoteDisc(nt.type==='left'?Lx:Rx, y, nt.type==='left'?'#ff6688':'#66aaff', nt.type==='left'?(lang==='ja'?'左':'L'):(lang==='ja'?'右':'R'));
  }
  ctx.textAlign='center'; ctx.font='bold 18px "Yu Mincho",serif'; ctx.lineWidth=4; ctx.strokeStyle='#000';
  const b=state.fever>0?t('feverBanner'):t('noteBanner');
  ctx.strokeText(b,CX,HITY-34); ctx.fillStyle=state.fever>0?'#fff200':'#9fe0ff'; ctx.fillText(b,CX,HITY-34);
}
function drawEffects(){
  state.effects.forEach(e=>{ ctx.save(); ctx.globalAlpha=Math.min(1,e.life/16);
    ctx.font='bold 22px "Yu Mincho",serif'; ctx.textAlign='center'; ctx.lineWidth=4; ctx.strokeStyle='#000';
    ctx.strokeText(e.txt,e.x,e.y); ctx.fillStyle=e.color; ctx.fillText(e.txt,e.x,e.y); ctx.restore(); });
  state.bigTexts.forEach(t=>{ ctx.save(); ctx.globalAlpha=Math.min(1,t.life/24); ctx.textAlign='center';
    ctx.font='bold 52px "Yu Mincho",serif'; ctx.lineWidth=7; ctx.strokeStyle='#aa0000';
    t.txt.split('\n').forEach((ln,i)=>{ const y=H/2-50+i*58; ctx.strokeText(ln,CX,y); ctx.fillStyle='#fff200'; ctx.fillText(ln,CX,y); }); ctx.restore(); });
}
function drawUI(){
  ctx.fillStyle='rgba(0,0,0,0.42)'; ctx.fillRect(0,0,W,42);
  ctx.textAlign='left'; ctx.textBaseline='alphabetic'; ctx.fillStyle='#ffd700'; ctx.font='bold 20px serif';
  ctx.fillText(t('dancers')(state.score),12,28);
  // 体力（ミスで減る）
  const lx=170,lw=150; ctx.fillStyle='#fff'; ctx.font='bold 13px serif'; ctx.textAlign='right'; ctx.fillText(t('life'),lx-8,27); ctx.textAlign='left';
  ctx.fillStyle='#2a0d0d'; ctx.fillRect(lx,13,lw,16);
  const lowLife=state.life<=30, blink=lowLife && Math.floor(Date.now()/200)%2===0;
  let lg=ctx.createLinearGradient(lx,0,lx+lw,0); lg.addColorStop(0,'#ff2233'); lg.addColorStop(1,'#ff8a3a');
  ctx.fillStyle=blink?'#fff':lg; ctx.fillRect(lx,13,lw*Math.max(0,state.life)/MAXLIFE,16);
  ctx.strokeStyle=lowLife?'#ff3333':'#ffcc00'; ctx.lineWidth=2; ctx.strokeRect(lx,13,lw,16);
  // 熱気（フィーバー用）
  const gx=400,gw=130; ctx.fillStyle='#fff'; ctx.font='bold 13px serif'; ctx.textAlign='right'; ctx.fillText(t('heat'),gx-8,27); ctx.textAlign='left';
  ctx.fillStyle='#301010'; ctx.fillRect(gx,13,gw,16);
  let gg=ctx.createLinearGradient(gx,0,gx+gw,0); gg.addColorStop(0,'#ff5500'); gg.addColorStop(1,'#ffdd33');
  ctx.fillStyle=state.fever>0?'#fff200':gg; ctx.fillRect(gx,13,gw*(state.heat/100),16);
  ctx.strokeStyle='#ffcc00'; ctx.lineWidth=2; ctx.strokeRect(gx,13,gw,16);
  ctx.textAlign='left'; ctx.fillStyle='#fff'; ctx.font='bold 11px serif'; ctx.fillText(t('venueOf')(state.stage),536,26);
  // 制覇ゲージ（クリア進捗）
  const got=state.target-state.audience.length, bx=CX-170, bw=340, by=52;
  ctx.fillStyle='rgba(0,0,0,0.55)'; roundRect(bx-8,by-5,bw+16,30,9); ctx.fill();
  ctx.fillStyle='#23160f'; ctx.fillRect(bx,by,bw,18);
  ctx.fillStyle='#39d05a'; ctx.fillRect(bx,by,bw*(got/Math.max(1,state.target)),18);
  ctx.strokeStyle='#ffcc00'; ctx.lineWidth=2; ctx.strokeRect(bx,by,bw,18);
  ctx.textAlign='center'; ctx.fillStyle='#fff'; ctx.font='bold 14px serif';
  ctx.fillText(t('remain')(state.audience.length)+'　（'+got+' / '+state.target+'）',CX,by+14);
  if(state.combo>=4){ ctx.fillStyle='#fff200'; ctx.font='bold 22px serif'; ctx.fillText(t('combo')(state.combo),CX,98); }
}
function drawIntro(){
  ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(0,0,W,H);
  const i=state.stage; ctx.textAlign='center';
  ctx.fillStyle='#ffcc00'; ctx.font='bold 28px serif';
  ctx.fillText(t('introVenue')(i),CX,H/2-110);
  ctx.fillStyle='#fff'; ctx.font='bold 54px "Yu Mincho",serif'; ctx.strokeStyle='#aa1100'; ctx.lineWidth=6;
  ctx.strokeText(locName(i),CX,H/2-36); ctx.fillText(locName(i),CX,H/2-36);
  ctx.fillStyle='#ffe9a8'; ctx.font='26px serif'; ctx.fillText('“'+songName(i)+'”',CX,H/2+14);
  ctx.fillStyle='#9fe0ff'; ctx.font='20px serif';
  ctx.fillText(t('introGoal')(state.target),CX,H/2+56);
  const c=Math.ceil(state.introT);
  ctx.fillStyle='#fff200'; ctx.font='bold 46px "Yu Mincho",serif';
  ctx.fillText(c>0?t('ready')(c):t('go'),CX,H/2+116);
}
function drawTitle(){
  ctx.fillStyle='rgba(0,0,0,0.58)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.fillStyle='#ffcc00'; ctx.font='bold 42px "Yu Mincho",serif'; ctx.strokeStyle='#aa1100'; ctx.lineWidth=6;
  ctx.strokeText(t('title'),CX,H/2-130); ctx.fillText(t('title'),CX,H/2-130);
  ctx.font='bold 26px "Yu Mincho",serif'; ctx.fillStyle='#ff8844';
  ctx.strokeText(t('subtitle'),CX,H/2-90); ctx.fillText(t('subtitle'),CX,H/2-90);
  ctx.fillStyle='#ffe9a8'; ctx.font='18px serif';
  ctx.fillText(t('inst1'),CX,H/2-40);
  ctx.fillText(t('inst2'),CX,H/2-10);
  ctx.fillText(t('inst3'),CX,H/2+18);
  ctx.fillText(t('inst4'),CX,H/2+46);
  ctx.fillStyle='#fff'; ctx.font='bold 26px serif';
  if(Math.floor(Date.now()/500)%2===0) ctx.fillText(t('start'),CX,H/2+104);
  ctx.fillStyle='#aaa'; ctx.font='13px serif'; ctx.fillText(t('audioNote'),CX,H/2+134);
}
function drawGameClear(){
  ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(0,0,W,H);
  let g=ctx.createLinearGradient(0,0,W,H); g.addColorStop(0,'rgba(255,80,0,0.35)'); g.addColorStop(1,'rgba(255,200,0,0.35)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.fillStyle='#fff200'; ctx.font='bold 50px "Yu Mincho",serif'; ctx.strokeStyle='#aa0000'; ctx.lineWidth=6;
  ctx.strokeText(t('gcTitle'),CX,150); ctx.fillText(t('gcTitle'),CX,150);
  ctx.fillStyle='#fff'; ctx.font='bold 28px serif'; ctx.fillText(t('gcSub'),CX,210);
  ctx.fillStyle='#ffd700'; ctx.font='26px serif'; ctx.fillText(t('gcScore')(state.score),CX,272);
  ctx.fillStyle='#fff'; ctx.font='20px serif'; ctx.fillText(t('gcStat')(state.maxCombo,state.great),CX,312);
  if(Math.floor(Date.now()/500)%2===0) ctx.fillText(t('gcBack'),CX,392);
}
function drawGameOver(){
  ctx.fillStyle='rgba(0,0,0,0.78)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.fillStyle='#ff4444'; ctx.font='bold 60px "Yu Mincho",serif'; ctx.strokeStyle='#000'; ctx.lineWidth=7;
  ctx.strokeText(t('gameover'),CX,180); ctx.fillText(t('gameover'),CX,180);
  ctx.fillStyle='#ddd'; ctx.font='24px serif'; ctx.fillText(t('goReason'),CX,234);
  ctx.fillStyle='#ffd700'; ctx.font='26px serif'; ctx.fillText(t('gcScore')(state.score),CX,300);
  ctx.fillStyle='#fff'; ctx.font='20px serif'; ctx.fillText(t('venueOf')(state.stage)+'　'+locName(state.stage),CX,338);
  ctx.fillStyle='#fff'; ctx.font='bold 22px serif';
  if(Math.floor(Date.now()/500)%2===0) ctx.fillText(t('goRetry'),CX,404);
}

// ===== ボタン描画 =====
function drawBtn(r,label,bg,fs){ ctx.fillStyle=bg; roundRect(r.x,r.y,r.w,r.h,7); ctx.fill();
  ctx.strokeStyle='#ffcc00'; ctx.lineWidth=2; ctx.stroke();
  ctx.fillStyle='#fff'; ctx.font='bold '+(fs||14)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(label,r.x+r.w/2,r.y+r.h/2+1); ctx.textBaseline='alphabetic'; }
function drawControls(){
  drawBtn(BTN_LANG,  t('langBtn'),'rgba(20,30,60,0.9)',15);
  drawBtn(BTN_PAUSE, state.paused?t('play'):t('pause'),'rgba(40,22,12,0.9)',16);
  drawBtn(BTN_BACK,  t('back'),'rgba(40,22,12,0.9)',16);
}
function drawTouchHint(){           // スマホ：左右タップ領域の目印
  if(!isTouch || state.phase!=='play') return;
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,0.12)'; ctx.lineWidth=2; ctx.setLineDash([8,8]);
  ctx.beginPath(); ctx.moveTo(CX,118); ctx.lineTo(CX,H-30); ctx.stroke(); ctx.setLineDash([]);
  ctx.globalAlpha=0.5; ctx.textAlign='center'; ctx.font='bold 14px serif'; ctx.fillStyle='#ff8aa0';
  ctx.fillText(t('tapL'),CX-150,H-8);
  ctx.fillStyle='#8ab8ff'; ctx.fillText(t('tapR'),CX+150,H-8);
  ctx.restore();
}
function drawPause(){
  ctx.fillStyle='rgba(0,0,0,0.62)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.fillStyle='#fff200'; ctx.font='bold 56px "Yu Mincho",serif'; ctx.strokeStyle='#aa0000'; ctx.lineWidth=6;
  ctx.strokeText(t('paused'),CX,H/2-40); ctx.fillText(t('paused'),CX,H/2-40);
  drawBtn(OV_RESUME,t('ovResume'),'rgba(30,90,40,0.95)',20);
  drawBtn(OV_BACK,  t('ovBack'),'rgba(120,40,40,0.95)',20);
  ctx.fillStyle='#ddd'; ctx.font='15px serif';
  ctx.fillText(t('pauseHelp'),CX,H/2+108);
}

// ===== ループ =====
function loop(ts){ let dt=0; if(lastTs!=null) dt=Math.min(0.05,(ts-lastTs)/1000); lastTs=ts;
  if(!state.paused) update(dt);
  drawBackground();
  if(state.flash>0){ ctx.fillStyle=`rgba(255,255,200,${Math.min(0.7,state.flash/30*0.7)})`; ctx.fillRect(0,0,W,H); }
  drawYagura();
  if(state.phase==='intro'||state.phase==='play'||state.phase==='stageclear'){ drawCrowd(); drawRipples(); }
  if(state.phase==='play'){ drawNotes(); drawTouchHint(); }
  if(state.phase==='play'||state.phase==='stageclear'){ drawEffects(); drawUI(); }
  if(state.phase==='intro') drawIntro();
  if(inGame()) drawControls();
  if(state.paused) drawPause();
  if(state.phase==='title') drawTitle();
  if(state.phase==='gameclear') drawGameClear();
  if(state.phase==='gameover') drawGameOver();
  if(state.phase==='title'||state.phase==='gameclear'||state.phase==='gameover') drawBtn(BTN_LANG,t('langBtn'),'rgba(20,30,60,0.9)',15);
  requestAnimationFrame(loop);
}
updateHint();
requestAnimationFrame(loop);
</script>
</body>
